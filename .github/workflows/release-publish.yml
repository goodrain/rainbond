name: release-publish

# 发版后的发布步骤：rainbond 发布 release 后，把 chart、快速安装脚本、
# upgrade-versions.json 和文档版本表一起发出去，替代原来的手工清单。
#
#   prepare  （无凭证）校验多架构镜像 → 生成全部产物 → 摘要里展示差异
#   publish  （environment: release-publish，需审批人批准）推 chart / 上传 TOS /
#             回写 upgrade-versions.json
#   verify   从线上重新下载，确认与产物一致
#   docs     次版本发布时给文档仓库提版本表草稿 PR（失败不影响 verify）
#   roi      触发 roi 仓库的发版工作流，构建并上传对应版本的 roi 二进制，跟踪到结束
#
# 使用说明与需要配置的 secrets / vars 见 hack/release/README.md。
#
# 安全：只由 release 发布或手动触发，绝不响应 pull_request；所有外部输入经 env 传入
# 并先由 release.py check-tag 校验，不直接插值进 shell。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v6.9.12-release
        required: true
        type: string
      dry_run:
        description: Only build and show artifacts, do not publish
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

# Targets default to the production ones. A fork rehearsal overrides them with
# repository variables (RELEASE_*) so it can never write to goodrain repos or
# the production bucket by accident; see hack/release/README.md.
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
  RAINBOND_REPO: ${{ vars.RELEASE_RAINBOND_REPO || 'goodrain/rainbond' }}
  CONSOLE_REPO: ${{ vars.RELEASE_CONSOLE_REPO || 'goodrain/rainbond-console' }}
  CHART_REPO: ${{ vars.RELEASE_CHART_REPO || 'goodrain/rainbond-chart' }}
  DOCS_REPO: ${{ vars.RELEASE_DOCS_REPO || 'goodrain/rainbond-docs' }}
  # roi 发版工作流配置好之前保持关闭（RELEASE_ROI=true 才触发）。
  ROI_REPO: ${{ vars.RELEASE_ROI_REPO || 'goodrain/roi' }}
  ROI_WORKFLOW: release-from-rainbond.yml
  ROI_PUBLIC_URL: ${{ vars.RELEASE_ROI_PUBLIC_URL || 'https://get.rainbond.com/roi/roi-amd64' }}
  CHART_REPO_URL: ${{ vars.RELEASE_CHART_REPO_URL || 'https://chart.rainbond.com' }}
  CHART_UPLOAD: ${{ vars.RELEASE_CHART_UPLOAD || 'true' }}
  INSTALL_SCRIPT_URL: ${{ vars.RELEASE_INSTALL_SCRIPT_URL || 'https://get.rainbond.com' }}
  UPGRADE_VERSIONS_URL: ${{ vars.RELEASE_UPGRADE_VERSIONS_URL || 'https://get.rainbond.com/upgrade-versions.json' }}

jobs:
  prepare:
    if: endsWith(github.event.release.tag_name || inputs.tag, '-release')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      chart_version: ${{ steps.tag.outputs.chart_version }}
      docs_changed: ${{ steps.docs.outputs.changed }}
      chart_main_version: ${{ steps.chart.outputs.main_version }}
    steps:
      - name: Checkout rainbond default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Unit tests for release helpers
        run: python3 -m unittest discover -s hack/release -p '*_test.py'

      - name: Validate tag
        id: tag
        run: python3 hack/release/release.py check-tag "$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release images are multi-arch
        run: python3 hack/release/release.py verify-images "$TAG"

      # trigger-downstream-releases.yml 同时在给 console 打 tag，这里等它出现。
      - name: Wait for rainbond-console tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do
            if gh api "repos/${CONSOLE_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              echo "found ${CONSOLE_REPO}@${TAG}"; exit 0
            fi
            sleep 20
          done
          echo "::error::${CONSOLE_REPO} has no tag ${TAG} after 10 minutes"
          exit 1

      - name: Build upgrade feed and install script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          published_at=$(gh release view "$TAG" --repo "$RAINBOND_REPO" --json publishedAt --jq .publishedAt)
          python3 hack/release/release.py upgrade-versions "$TAG" \
            --published-at "$published_at" --output dist/upgrade-versions.json
          curl -fsSL "https://raw.githubusercontent.com/${CONSOLE_REPO}/${TAG}/script/install-rainbond.sh" \
            -o "$RUNNER_TEMP/install-src.sh"
          python3 hack/release/release.py install-script "$TAG" \
            --source "$RUNNER_TEMP/install-src.sh" --output dist/install.sh

      - name: Checkout chart repository main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHART_REPO }}
          ref: main
          path: chart

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # chart-bump never moves the chart backwards, so on a rollback run main_version
      # stays newer than the tag and publish leaves the chart repository alone.
      - name: Bump and package chart
        id: chart
        run: |
          set -euo pipefail
          python3 hack/release/release.py chart-bump "$TAG" --chart-dir chart
          echo "main_version=$(awk '/^version:/ {print $2; exit}' chart/Chart.yaml)" >> "$GITHUB_OUTPUT"
          git -C chart diff > dist/chart.patch
          helm lint chart
          helm package chart -d dist

      - name: Checkout docs repository main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DOCS_REPO }}
          ref: main
          path: docs

      - name: Roll docs version table on a new minor release
        id: docs
        run: |
          set -euo pipefail
          python3 hack/release/release.py docs-versions "$TAG" --file docs/docs/versions.md >> "$GITHUB_OUTPUT"
          git -C docs diff > dist/docs.patch

      - name: Summary
        env:
          CHART_MAIN_VERSION: ${{ steps.chart.outputs.main_version }}
          CHART_TARGET_VERSION: ${{ steps.tag.outputs.chart_version }}
        run: |
          {
            echo "## ${TAG} 发布预览"
            echo
            echo "| 项目 | 结果 |"
            echo "|---|---|"
            echo "| 多架构镜像 | ✅ 全部 amd64 + arm64 |"
            echo "| chart 版本 | \`$(grep -m1 '^version:' chart/Chart.yaml)\`${{ steps.chart.outputs.main_version != steps.tag.outputs.chart_version && '（比本次版本新：按回滚处理，不改动 chart）' || '' }} |"
            echo "| chart 上传到 ${CHART_REPO_URL} | ${{ env.CHART_UPLOAD == 'true' && '是' || '否（RELEASE_CHART_UPLOAD=false；chart 仓库的提交和 tag 仍由 publish 完成）' }} |"
            echo "| 文档版本表 | ${{ steps.docs.outputs.changed == 'true' && '需要更新（将提 PR）' || '无需更新' }} |"
            echo
            # 对比的是「当前线上文件」而不是仓库：审批人要看的是批准后线上会变成什么。
            show_diff() {
              local title=$1 url=$2 file=$3 current
              current="$RUNNER_TEMP/current-${3##*/}"
              echo "### ${title}（对比当前线上 ${url}）"
              if ! curl -fsSL -H 'Cache-Control: no-cache' "$url" -o "$current"; then
                echo "⚠️ 无法下载当前线上文件，未能对比"
              elif cmp -s "$current" "$file"; then
                echo "与线上相比无变化"
              else
                echo '```diff'
                diff -u --label "线上" --label "将发布" "$current" "$file" || true
                echo '```'
              fi
            }
            show_diff "upgrade-versions.json 变更" "$UPGRADE_VERSIONS_URL" dist/upgrade-versions.json
            show_diff "安装脚本变更" "$INSTALL_SCRIPT_URL" dist/install.sh
            echo "### chart 变更（${CHART_REPO} main）"
            if [ -s dist/chart.patch ]; then
              echo '```diff'
              cat dist/chart.patch
              echo '```'
            elif [ "$CHART_MAIN_VERSION" != "$CHART_TARGET_VERSION" ]; then
              echo "main 已是 \`${CHART_MAIN_VERSION}\`，比本次版本新：按回滚处理，不改动 chart，也不打 tag、不上传"
            else
              echo "main 已是 \`${CHART_MAIN_VERSION}\`，无需提交；publish 只会补打 tag（已存在则跳过）"
            fi
            echo "### 产物 sha256"
            echo '```'
            (cd dist && find . -type f -size +0 | sort | xargs sha256sum)
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"   # tee: the release assistant reads the preview from the job log

      - uses: actions/upload-artifact@v4
        with:
          name: release-publish-${{ env.TAG }}
          path: dist/
          retention-days: 30

      - name: Notify approval 2
        if: github.event_name == 'release' || inputs.dry_run == false
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 hack/release/release.py notify --title "【待审批 2】${TAG} 对外发布" \
            --line "chart、安装脚本和 upgrade feed 已生成，审批前请先看运行摘要里与线上的差异。" \
            --line "批准后所有用户的控制台会看到新版本提示，安装脚本默认版本也会变化。" \
            --link "$RUN_URL" --link-text "去审批"

  publish:
    needs: prepare
    if: github.event_name == 'release' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publish
    permissions:
      contents: write
    env:
      CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
      # false on a rollback run (re-publishing an older release): chart stays as is.
      CHART_CURRENT: ${{ needs.prepare.outputs.chart_main_version == needs.prepare.outputs.chart_version }}
      TOS_ENDPOINT: ${{ vars.TOS_ENDPOINT }}
      TOS_REGION: ${{ vars.TOS_REGION }}
      TOS_BUCKET: ${{ vars.TOS_BUCKET }}
      TOS_KEY_INSTALL_SCRIPT: ${{ vars.TOS_KEY_INSTALL_SCRIPT }}
      TOS_KEY_UPGRADE_VERSIONS: ${{ vars.TOS_KEY_UPGRADE_VERSIONS }}
      TOSUTIL_URL: ${{ vars.TOSUTIL_URL }}
      TOSUTIL_SHA256: ${{ vars.TOSUTIL_SHA256 }}
    steps:
      # 先把缺的配置一次性列出来，而不是传到一半才失败。只打印名称，不打印值。
      - name: Check configuration
        env:
          HAS_CROSS_TOKEN: ${{ secrets.CROSS_REPO_RELEASE_TOKEN != '' }}
          HAS_TOS_AK: ${{ secrets.TOS_ACCESS_KEY != '' }}
          HAS_TOS_SK: ${{ secrets.TOS_SECRET_KEY != '' }}
          HAS_CHART_USER: ${{ secrets.CHART_REPO_USERNAME != '' }}
          HAS_CHART_PASS: ${{ secrets.CHART_REPO_PASSWORD != '' }}
          HAS_RAINBOND_KEY: ${{ secrets.RAINBOND_DEPLOY_KEY != '' }}
          HAS_CHART_KEY: ${{ secrets.CHART_DEPLOY_KEY != '' }}
        run: |
          missing=()
          for v in TOS_ENDPOINT TOS_REGION TOS_BUCKET TOS_KEY_INSTALL_SCRIPT TOS_KEY_UPGRADE_VERSIONS TOSUTIL_URL TOSUTIL_SHA256; do
            [ -n "${!v}" ] || missing+=("var $v")
          done
          [ "$HAS_CROSS_TOKEN" = true ] || missing+=("secret CROSS_REPO_RELEASE_TOKEN")
          [ "$HAS_TOS_AK" = true ] || missing+=("secret TOS_ACCESS_KEY")
          [ "$HAS_TOS_SK" = true ] || missing+=("secret TOS_SECRET_KEY")
          [ "$HAS_RAINBOND_KEY" = true ] || missing+=("secret RAINBOND_DEPLOY_KEY")
          [ "$HAS_CHART_KEY" = true ] || missing+=("secret CHART_DEPLOY_KEY")
          if [ "$CHART_UPLOAD" = true ]; then
            [ "$HAS_CHART_USER" = true ] || missing+=("secret CHART_REPO_USERNAME")
            [ "$HAS_CHART_PASS" = true ] || missing+=("secret CHART_REPO_PASSWORD")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::release-publish environment is missing %s\n' "${missing[@]}"
            exit 1
          fi
          echo "targets: chart=${CHART_REPO} docs=${DOCS_REPO} install=${INSTALL_SCRIPT_URL} feed=${UPGRADE_VERSIONS_URL} chart_upload=${CHART_UPLOAD}"

      - name: Checkout rainbond default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - uses: actions/download-artifact@v4
        with:
          name: release-publish-${{ env.TAG }}
          path: dist

      # main 受规则集保护（必须走 PR、chart 要求签名），GITHUB_TOKEN 和普通令牌都推不上去。
      # 两次推送改用各仓库的部署密钥，规则集里只放行部署密钥；私钥只在本环境（审批 2 之后）可用。
      # 配置方法见 hack/release/setup-deploy-keys.sh。
      - name: Set up deploy keys
        env:
          RAINBOND_DEPLOY_KEY: ${{ secrets.RAINBOND_DEPLOY_KEY }}
          CHART_DEPLOY_KEY: ${{ secrets.CHART_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/ssh"; mkdir -p "$d"
          printf '%s\n' "$RAINBOND_DEPLOY_KEY" > "$d/rainbond"
          printf '%s\n' "$CHART_DEPLOY_KEY" > "$d/chart"
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$d/known_hosts"
          for k in rainbond chart; do
            echo "GIT_SSH_${k^^}=ssh -i $d/$k -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$d/known_hosts" >> "$GITHUB_ENV"
          done

      - name: Install and configure tosutil
        env:
          TOS_ACCESS_KEY: ${{ secrets.TOS_ACCESS_KEY }}
          TOS_SECRET_KEY: ${{ secrets.TOS_SECRET_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL "$TOSUTIL_URL" -o "$RUNNER_TEMP/tosutil"
          echo "${TOSUTIL_SHA256}  $RUNNER_TEMP/tosutil" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tosutil"
          "$RUNNER_TEMP/tosutil" config -i "$TOS_ACCESS_KEY" -k "$TOS_SECRET_KEY" -e "$TOS_ENDPOINT" -re "$TOS_REGION" >/dev/null

      # 写之前确认每个对象 key 背后就是对应的公开地址：key 配错时宁可失败，
      # 也不能把别的文件（比如 roi 二进制）覆盖掉。放在任何写操作之前。
      - name: Check TOS keys back the public URLs
        run: |
          set -euo pipefail
          check() {
            local key=$1 url=$2 origin="$RUNNER_TEMP/origin-$3" public="$RUNNER_TEMP/public-$3"
            "$RUNNER_TEMP/tosutil" cp "tos://${TOS_BUCKET}/${key}" "$origin" >/dev/null
            curl -fsSL -H 'Cache-Control: no-cache' "$url" -o "$public"
            if ! cmp -s "$origin" "$public"; then
              echo "::error::tos://${TOS_BUCKET}/${key} is not what ${url} serves; check TOS_BUCKET / TOS_KEY_* (or wait for the CDN to refresh) before publishing"
              exit 1
            fi
            echo "tos://${TOS_BUCKET}/${key} backs ${url} ($(sha256sum < "$origin" | cut -c1-12))"
          }
          check "$TOS_KEY_INSTALL_SCRIPT" "$INSTALL_SCRIPT_URL" install
          check "$TOS_KEY_UPGRADE_VERSIONS" "$UPGRADE_VERSIONS_URL" feed

      # 先提交版本号再让 chart 仓库打 tag，避免 tag 里还是旧版本号。
      - name: Commit chart version and create chart release
        if: env.CHART_CURRENT == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -s dist/chart.patch ]; then
            gh auth setup-git
            git clone --depth 1 --branch main "https://github.com/${CHART_REPO}.git" "$RUNNER_TEMP/chart"
            cd "$RUNNER_TEMP/chart"
            git apply "$GITHUB_WORKSPACE/dist/chart.patch"
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -am "chore: release ${TAG}"
            GIT_SSH_COMMAND="$GIT_SSH_CHART" git push "git@github.com:${CHART_REPO}.git" HEAD:main
            chart_sha=$(git rev-parse HEAD)
          else
            echo "chart already at ${CHART_VERSION}, nothing to commit"
            chart_sha=$(gh api "repos/${CHART_REPO}/commits/main" --jq .sha)
          fi
          # Tag the commit that carries this version, not whatever main is later.
          gh workflow run auto-release-from-rainbond.yml --repo "$CHART_REPO" --ref main \
            -f tag="$TAG" -f rainbond_release_url="https://github.com/${RAINBOND_REPO}/releases/tag/${TAG}" \
            -f target="$chart_sha"

      - name: Upload chart to the chart repository
        if: env.CHART_UPLOAD == 'true' && env.CHART_CURRENT == 'true'
        env:
          CHART_REPO_USERNAME: ${{ secrets.CHART_REPO_USERNAME }}
          CHART_REPO_PASSWORD: ${{ secrets.CHART_REPO_PASSWORD }}
        run: |
          set -euo pipefail
          # 先落盘再 grep：`curl | grep -q` 在 grep 提前退出时 curl 会报错（23），pipefail 下会被误判为「不存在」。
          curl -fsSL "${CHART_REPO_URL}/index.yaml" -o "$RUNNER_TEMP/chart-index.yaml"
          if grep -q "charts/rainbond-${CHART_VERSION}.tgz" "$RUNNER_TEMP/chart-index.yaml"; then
            echo "rainbond-${CHART_VERSION}.tgz is already on ${CHART_REPO_URL}, skip (never overwrite)"
            exit 0
          fi
          # 凭证经 stdin 传给 curl，不出现在命令行参数里。
          printf 'user = "%s:%s"\n' "$CHART_REPO_USERNAME" "$CHART_REPO_PASSWORD" \
            | curl -fsS -K - --data-binary "@dist/rainbond-${CHART_VERSION}.tgz" "${CHART_REPO_URL}/api/charts"
          echo

      # 先记录到仓库、再上传到 TOS：下一次发版从仓库里的这份文件生成 feed，
      # 推送失败时必须在线上还没变之前停下，否则下一版会把这一版从 feed 里丢掉。
      - name: Record upgrade feed in repository
        run: |
          set -euo pipefail
          cp dist/upgrade-versions.json hack/release/upgrade-versions.json
          if git diff --quiet; then
            echo "upgrade-versions.json already recorded"; exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "chore: record ${TAG} in upgrade feed"
          GIT_SSH_COMMAND="$GIT_SSH_RAINBOND" git push "git@github.com:${GITHUB_REPOSITORY}.git" "HEAD:${SOURCE_BRANCH}"

      - name: Upload install script and upgrade feed to TOS
        run: |
          set -euo pipefail
          # 先传安装脚本，再传 upgrade feed：feed 一更新，存量控制台就会提示升级。
          "$RUNNER_TEMP/tosutil" cp dist/install.sh "tos://${TOS_BUCKET}/${TOS_KEY_INSTALL_SCRIPT}" -contentType=application/x-sh
          "$RUNNER_TEMP/tosutil" cp dist/upgrade-versions.json "tos://${TOS_BUCKET}/${TOS_KEY_UPGRADE_VERSIONS}" -contentType=application/json

  verify:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout rainbond default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - uses: actions/download-artifact@v4
        with:
          name: release-publish-${{ env.TAG }}
          path: dist

      - name: Published files match artifacts
        run: |
          set -euo pipefail
          python3 hack/release/release.py verify-url "$UPGRADE_VERSIONS_URL" --file dist/upgrade-versions.json
          python3 hack/release/release.py verify-url "$INSTALL_SCRIPT_URL" --file dist/install.sh

      - name: Chart is on the chart repository
        if: env.CHART_UPLOAD == 'true' && needs.prepare.outputs.chart_main_version == needs.prepare.outputs.chart_version
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
        run: |
          curl -fsSL "${CHART_REPO_URL}/index.yaml" -o "$RUNNER_TEMP/chart-index.yaml"
          grep -q "charts/rainbond-${CHART_VERSION}.tgz" "$RUNNER_TEMP/chart-index.yaml"

      - name: Notify done
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 hack/release/release.py notify --title "【发布完成】${TAG}" \
            --line "安装脚本和 upgrade feed 已从线上回读校验通过。" \
            --line "${{ vars.RELEASE_ROI == 'true' && 'roi 二进制由本运行的 roi 任务发布；离线包如需更新，请按发版手册单独处理。' || '离线包和 roi 二进制如需更新，请按发版手册单独处理。' }}" \
            --link "$RUN_URL" --link-text "查看运行"

  # 文档 PR 和 roi 不放进 publish：它们失败时不应挡住线上校验，也可以单独重跑这一个 job。
  # 只用仓库级的 CROSS_REPO_RELEASE_TOKEN，不进 release-publish environment，避免再审批一次。
  docs:
    needs: [prepare, publish]
    if: needs.prepare.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-publish-${{ env.TAG }}
          path: dist

      - name: Open docs pull request
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          branch="release/${TAG}-versions"
          existing=$(gh pr list --repo "$DOCS_REPO" --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "docs PR already open: $existing"
            echo "文档 PR：$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh auth setup-git
          git clone --depth 1 --branch main "https://github.com/${DOCS_REPO}.git" "$RUNNER_TEMP/docs"
          cd "$RUNNER_TEMP/docs"
          git checkout -b "$branch"
          git apply "$GITHUB_WORKSPACE/dist/docs.patch"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "docs: roll version table for ${TAG}"
          git push --force origin "$branch"
          url=$(gh pr create --repo "$DOCS_REPO" --base main --head "$branch" --draft \
            --title "docs: roll version table for ${TAG}" \
            --body "Automated by release-publish. Archive the previous minor docs site before merging.")
          echo "文档 PR：$url" >> "$GITHUB_STEP_SUMMARY"

  roi:
    needs: [prepare, publish]
    # 回滚旧版本时（chart 不是最新）不动 roi。
    if: vars.RELEASE_ROI == 'true' && needs.prepare.outputs.chart_main_version == needs.prepare.outputs.chart_version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout rainbond default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Run the roi release workflow
        id: roi
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # 重跑时：线上 roi 已经是这个版本就不再构建。
          if curl -fsSL "$ROI_PUBLIC_URL" -o "$RUNNER_TEMP/roi" && strings "$RUNNER_TEMP/roi" | grep -Fq "$TAG"; then
            echo "roi at ${ROI_PUBLIC_URL} already embeds ${TAG}; nothing to do"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run "$ROI_WORKFLOW" --repo "$ROI_REPO" --ref main -f tag="$TAG"
          run_id=
          for _ in $(seq 1 24); do
            sleep 5
            run_id=$(gh run list --repo "$ROI_REPO" --workflow "$ROI_WORKFLOW" --event workflow_dispatch --limit 5 \
              --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"${since}\")] | last | .databaseId // empty")
            [ -n "$run_id" ] && break
          done
          [ -n "$run_id" ] || { echo "::error::dispatched ${ROI_WORKFLOW} but no run showed up in ${ROI_REPO}"; exit 1; }
          url="https://github.com/${ROI_REPO}/actions/runs/${run_id}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "roi 发版运行：$url" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" --repo "$ROI_REPO" --interval 30 --exit-status > /dev/null

      - name: Notify roi published
        if: steps.roi.outputs.url != ''
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          ROI_RUN_URL: ${{ steps.roi.outputs.url }}
        run: |
          python3 hack/release/release.py notify --title "【roi 已发布】${TAG}" \
            --line "amd64 / arm64 二进制已上传，并从线上回读校验了嵌入的版本。" \
            --link "$ROI_RUN_URL" --link-text "查看 roi 运行"

  notify-failure:
    needs: [prepare, publish, verify, docs, roi]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Notify failure
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 hack/release/release.py notify --title "【失败】${TAG} 对外发布失败" \
            --line "release-publish 有步骤失败，请查看日志；已发布的部分不会被回滚，可修复后直接重跑。" \
            --link "$RUN_URL" --link-text "查看运行"
