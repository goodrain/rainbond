name: release-v6
on:
  workflow_dispatch:
jobs:
  verify-existing-digest:
    runs-on: ubuntu-latest
    environment: release-v6
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rainbond
            digest: sha256:62bb5c1cf0ca76419aeb91436e1ecbe1550a2ec8d55bd1274478a15351e04905
          - image: rbd-chaos
            digest: sha256:5c03226077fa5266d35e67cbdf8d56d7a569fd56d45f609df330a15c52f8c219
    steps:
      - uses: actions/checkout@v4
        with:
          ref: afc7b13dea471a89cefd9bd407d3f79202f8ecf2
          persist-credentials: false
      - name: Install Skopeo
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/login-action@v3
        timeout-minutes: 2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v3
        timeout-minutes: 2
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOMESTIC_DOCKER_USERNAME }}
          password: ${{ secrets.DOMESTIC_DOCKER_PASSWORD }}
      - name: Copy original failed digest without building
        timeout-minutes: 33
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ matrix.digest }}
        run: |
          bash hack/release/sync-image.sh "docker.io/rainbond/${IMAGE}@${DIGEST}" \
            "registry.cn-hangzhou.aliyuncs.com/goodrain/${IMAGE}:dev-acr-get-auth-20261116-existing"
