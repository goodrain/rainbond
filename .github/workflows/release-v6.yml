name: "release-v6"
on:
  # release.yml calls this with pinned commits so the images are built from
  # exactly what E2E tested. Manual runs keep working as before.
  workflow_call:
    inputs:
      branch:
        type: string
        default: main
      version:
        type: string
        required: true
      build-who:
        type: string
        default: all
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      outputs:
        type: string
        default: ""
      rainbond_ref:
        type: string
        default: ""
      console_ref:
        type: string
        default: ""
      ui_ref:
        type: string
        default: ""
      operator_ref:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      rainbond_ref:
        description: 'rainbond commit (default: branch)'
        required: false
        default: ''
      console_ref:
        description: 'rainbond-console commit (default: branch)'
        required: false
        default: ''
      ui_ref:
        description: 'rainbond-ui commit (default: branch)'
        required: false
        default: ''
      operator_ref:
        description: 'rainbond-operator commit (default: branch)'
        required: false
        default: ''
      branch:
        description: 'branch'
        required: true
        default: 'main'
      version:
        description: 'version'
        required: true
        default: 'v6.0-dev'
      build-who:
        description: 'build-who'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - operator
          - region
          - console
      platforms:
        description: 'platforms'
        required: true
        default: 'linux/amd64'
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
      outputs:
        description: 'outputs parameter'
        default: ''
        type: choice
        options:
          - ""
          - type=registry,oci-mediatypes=true,compression=estargz,force-compression=true
      
env:
  VERSION: ${{ inputs.version }}
  IS_MULTI_ARCH: ${{ inputs.platforms == 'linux/amd64,linux/arm64' }}

jobs:
  rainbond-unit-test:
    runs-on: ubuntu-latest
    outputs:
      sync-matrix: ${{ steps.sync-matrix.outputs.matrix }}
    steps:
      - name: Prepare Aliyun sync matrix
        id: sync-matrix
        env:
          BUILD_WHO: ${{ inputs.build-who }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          groups = {
              "region": ["rbd-api", "rbd-chaos", "rbd-worker", "rbd-init-probe", "rbd-mq"],
              "operator": ["rainbond-operator"],
              "console": ["rainbond"],
          }
          selected = os.environ["BUILD_WHO"]
          images = sum(groups.values(), []) if selected == "all" else groups[selected]
          arches = [platform.removeprefix("linux/") for platform in os.environ["PLATFORMS"].split(",")]
          matrix = {"include": [{"image": image, "arch": arch} for image in images for arch in arches]}
          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          PYTHON

      # An amd64-only build pushes the plain <version> tag, which would replace
      # the published amd64+arm64 manifest and break arm64 installs.
      # Forks may hold real registry credentials; a fork must never push a
      # release tag into the official rainbond/* or goodrain/* namespaces.
      - name: Refuse release versions outside goodrain/rainbond
        if: ${{ endsWith(inputs.version, '-release') && github.repository != 'goodrain/rainbond' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "::error::${RELEASE_VERSION} is a release version; only goodrain/rainbond may build it"
          exit 1

      - name: Refuse single-arch builds of release versions
        if: ${{ endsWith(inputs.version, '-release') && inputs.platforms != 'linux/amd64,linux/arm64' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "::error::${RELEASE_VERSION} is a release version; build it with platforms=linux/amd64,linux/arm64 or use a non -release tag"
          exit 1

      - name: Checkout repository
        if: ${{ inputs.build-who == 'all' || inputs.build-who == 'region' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rainbond_ref || inputs.branch }}

      - name: Install native dependencies
        if: ${{ inputs.build-who == 'all' || inputs.build-who == 'region' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libzmq3-dev

      - name: Set up Go
        if: ${{ inputs.build-who == 'all' || inputs.build-who == 'region' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        if: ${{ inputs.build-who == 'all' || inputs.build-who == 'region' }}
        run: go test -mod=mod ./... -count=1

      - name: Check test manifest
        if: ${{ inputs.build-who == 'all' || inputs.build-who == 'region' }}
        run: make test-manifest-check

      - name: Skip unit tests
        if: ${{ inputs.build-who != 'all' && inputs.build-who != 'region' }}
        run: echo "Skip Rainbond Go unit tests for build-who=${{ inputs.build-who }}"

  rainbond-region:
    needs: rainbond-unit-test
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    environment: release-v6
    strategy:
      matrix:
        component: [api, chaos, worker, init-probe, mq]
        arch: [amd64, arm64]
        exclude:
          - arch: ${{ inputs.platforms == 'linux/amd64' && 'arm64' || 'none' }}
    if: inputs.build-who == 'all' || inputs.build-who == 'region'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rainbond_ref || inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set release description
        run: |
          buildTime=$(date +%F-%H)
          git_commit=$(git log -n 1 --pretty --format=%h)
          release_desc="${{ env.VERSION }}-${git_commit}-${buildTime}"
          echo "release_desc=${release_desc}" >> "${GITHUB_ENV}"

      - name: Build and push to Docker Hub
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          build-args: |
            RELEASE_DESC=${{ env.release_desc }}
            RAINBOND_ERROR_REPORTING_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_DSN }}
            RAINBOND_ERROR_REPORTING_REGION_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_REGION_DSN }}
            RAINBOND_ERROR_REPORTING_BACKEND_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_BACKEND_DSN }}
            RAINBOND_POSTHOG_PROJECT_TOKEN=${{ secrets.RAINBOND_POSTHOG_PROJECT_TOKEN }}
          context: .
          file: hack/contrib/docker/${{ matrix.component }}/Dockerfile
          outputs: ${{ inputs.outputs }}
          push: true
          provenance: false
          tags: |
            rainbond/rbd-${{ matrix.component }}:${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }}

      - name: Save image digest for Aliyun sync
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/image-digest"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: release-digest-rbd-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digest
          if-no-files-found: error
          overwrite: true

  rainbond-operator:
    needs: rainbond-unit-test
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    environment: release-v6
    strategy:
      matrix:
        arch: [amd64, arm64]
        exclude:
          - arch: ${{ inputs.platforms == 'linux/amd64' && 'arm64' || 'none' }}
    if: ${{ inputs.build-who == 'all' || inputs.build-who == 'operator' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: goodrain/rainbond-operator
          ref: ${{ inputs.operator_ref || inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push to Docker Hub
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          context: .
          file: ./Dockerfile
          outputs: ${{ inputs.outputs }}
          push: true
          provenance: false
          tags: |
            rainbond/rainbond-operator:${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }}

      - name: Save image digest for Aliyun sync
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/image-digest"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: release-digest-rainbond-operator-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digest
          if-no-files-found: error
          overwrite: true

  rainbond-ui:
    needs: rainbond-unit-test
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    environment: release-v6
    strategy:
      matrix:
        arch: [amd64, arm64]
        exclude:
          - arch: ${{ inputs.platforms == 'linux/amd64' && 'arm64' || 'none' }}
    if: ${{ inputs.build-who == 'all' || inputs.build-who == 'console' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: goodrain/rainbond-ui
          ref: ${{ inputs.ui_ref || inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=registry,ref=rainbond/rainbond-ui:buildcache-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'package.json', 'yarn.lock', '.npmrc') }}
          cache-to: type=registry,ref=rainbond/rainbond-ui:buildcache-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'package.json', 'yarn.lock', '.npmrc') }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          provenance: false
          tags: |
            rainbond/rainbond-ui:${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }}
  
  rainbond-allinone:
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    needs: [rainbond-unit-test, rainbond-ui]
    environment: release-v6
    strategy:
      matrix:
        arch: [amd64, arm64]
        exclude:
          - arch: ${{ inputs.platforms == 'linux/amd64' && 'arm64' || 'none' }}
    if: ${{ inputs.build-who == 'all' || inputs.build-who == 'console' }}
    steps:
      - name: Checkout rainbond-console repository
        uses: actions/checkout@v4
        with:
          repository: goodrain/rainbond-console
          ref: ${{ inputs.console_ref || inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set release description
        run: |
          buildTime=$(date +%F-%H)
          git_commit=$(git log -n 1 --pretty --format=%h)
          release_desc="${{ env.VERSION }}-${git_commit}-${buildTime}"
          echo "release_desc=${release_desc}" >> "${GITHUB_ENV}"

      - name: Build and push to Docker Hub
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          build-args: |
            RELEASE_DESC=${{ env.release_desc }}
            VERSION=${{ env.VERSION }}
            IMAGE_VERSION=${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }} 
            RAINBOND_ERROR_REPORTING_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_DSN }}
            RAINBOND_ERROR_REPORTING_FRONTEND_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_FRONTEND_DSN }}
            RAINBOND_ERROR_REPORTING_CONSOLE_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_CONSOLE_DSN }}
            RAINBOND_ERROR_REPORTING_BACKEND_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_BACKEND_DSN }}
          context: .
          file: ./Dockerfile
          outputs: ${{ inputs.outputs }}
          push: true
          cache-from: type=registry,ref=rainbond/rainbond:buildcache-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'requirements.txt', 'scripts/install_openapi_client.sh') }}
          cache-to: type=registry,ref=rainbond/rainbond:buildcache-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'requirements.txt', 'scripts/install_openapi_client.sh') }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          provenance: false
          tags: |
            rainbond/rainbond:${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }}

      - name: Save image digest for Aliyun sync
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/image-digest"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: release-digest-rainbond-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-digest
          if-no-files-found: error
          overwrite: true

  # Registry failures can now be rerun without recompiling any images.
  sync-aliyun:
    needs: [rainbond-unit-test, rainbond-region, rainbond-operator, rainbond-allinone]
    if: >-
      ${{ !cancelled() && needs.rainbond-unit-test.result == 'success' &&
          (needs.rainbond-region.result == 'success' || needs.rainbond-region.result == 'skipped') &&
          (needs.rainbond-operator.result == 'success' || needs.rainbond-operator.result == 'skipped') &&
          (needs.rainbond-allinone.result == 'success' || needs.rainbond-allinone.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: release-v6
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.rainbond-unit-test.outputs.sync-matrix) }}
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download image digest
        uses: actions/download-artifact@v4
        with:
          name: release-digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/registry-sync

      - name: Install Skopeo
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        timeout-minutes: 2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        timeout-minutes: 2
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOMESTIC_DOCKER_USERNAME }}
          password: ${{ secrets.DOMESTIC_DOCKER_PASSWORD }}

      - name: Sync image to Aliyun by digest
        timeout-minutes: 33
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          digest=$(cat "$RUNNER_TEMP/registry-sync/image-digest")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Invalid image digest"; exit 1; }
          tag="$VERSION"
          if [[ "$IS_MULTI_ARCH" == "true" ]]; then
            tag="${tag}-${ARCH}"
          fi
          source="docker.io/rainbond/${IMAGE}@${digest}"
          target="registry.cn-hangzhou.aliyuncs.com/goodrain/${IMAGE}:${tag}"
          echo "Syncing ${source} -> ${target}"
          bash hack/release/sync-image.sh "$source" "$target"

  multi-arch-manifest:
    runs-on: ubuntu-latest
    needs: [rainbond-region, rainbond-operator, rainbond-ui, rainbond-allinone, sync-aliyun]
    if: >-
      ${{ !cancelled() && inputs.platforms == 'linux/amd64,linux/arm64' &&
          needs.sync-aliyun.result == 'success' &&
          (needs.rainbond-ui.result == 'success' || needs.rainbond-ui.result == 'skipped') }}
    environment: release-v6
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Skopeo
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOMESTIC_DOCKER_USERNAME }}
          password: ${{ secrets.DOMESTIC_DOCKER_PASSWORD }}

      - name: Create manifests
        timeout-minutes: 20
        env:
          BUILD_WHO: ${{ inputs.build-who }}
        run: |
          set -euo pipefail
          publish_manifest() {
            local image="$1"
            local source="docker.io/rainbond/${image}:${VERSION}"
            echo "Creating manifest for ${image}..."
            bash hack/release/retry.sh docker buildx imagetools create -t "$source" \
              "${source}-amd64" "${source}-arm64"
            if [[ "$image" != "rainbond-ui" ]]; then
              # Each child digest was already copied by sync-aliyun. Transfer only
              # the index, using the same GET authentication path as layer sync.
              bash hack/release/retry.sh skopeo inspect --raw \
                --authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" \
                "docker://${source}" > "$RUNNER_TEMP/manifest.json"
              local digest
              digest="sha256:$(sha256sum "$RUNNER_TEMP/manifest.json" | cut -d ' ' -f 1)"
              bash hack/release/sync-image.sh --index-only "docker.io/rainbond/${image}@${digest}" \
                "registry.cn-hangzhou.aliyuncs.com/goodrain/${image}:${VERSION}"
            fi
          }

          if [[ "$BUILD_WHO" == "all" || "$BUILD_WHO" == "region" ]]; then
            for component in api chaos worker init-probe mq; do
              publish_manifest "rbd-${component}"
            done
          fi
          if [[ "$BUILD_WHO" == "all" || "$BUILD_WHO" == "operator" ]]; then
            publish_manifest rainbond-operator
          fi
          if [[ "$BUILD_WHO" == "all" || "$BUILD_WHO" == "console" ]]; then
            publish_manifest rainbond
            publish_manifest rainbond-ui
          fi
