name: "release-v6"
on:
  # release.yml calls this with pinned commits so the images are built from
  # exactly what E2E tested. Manual runs keep working as before.
  workflow_call:
    inputs:
      branch:
        type: string
        default: main
      version:
        type: string
        required: true
      build-who:
        type: string
        default: all
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      outputs:
        type: string
        default: ""
      rainbond_ref:
        type: string
        default: ""
      console_ref:
        type: string
        default: ""
      ui_ref:
        type: string
        default: ""
      operator_ref:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      rainbond_ref:
        description: 'rainbond commit (default: branch)'
        required: false
        default: ''
      console_ref:
        description: 'rainbond-console commit (default: branch)'
        required: false
        default: ''
      ui_ref:
        description: 'rainbond-ui commit (default: branch)'
        required: false
        default: ''
      operator_ref:
        description: 'rainbond-operator commit (default: branch)'
        required: false
        default: ''
      branch:
        description: 'branch'
        required: true
        default: 'main'
      version:
        description: 'version'
        required: true
        default: 'v6.0-dev'
      build-who:
        description: 'build-who'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - operator
          - region
          - console
      platforms:
        description: 'platforms'
        required: true
        default: 'linux/amd64'
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
      outputs:
        description: 'outputs parameter'
        default: ''
        type: choice
        options:
          - ""
          - type=registry,oci-mediatypes=true,compression=estargz,force-compression=true
      
env:
  VERSION: ${{ inputs.version }}
  IS_MULTI_ARCH: ${{ inputs.platforms == 'linux/amd64,linux/arm64' }}

jobs:
  rainbond-unit-test:
    runs-on: ubuntu-latest
    steps:
      # An amd64-only build pushes the plain <version> tag, which would replace
      # the published amd64+arm64 manifest and break arm64 installs.
      # Forks may hold real registry credentials; a fork must never push a
      # release tag into the official rainbond/* or goodrain/* namespaces.
      - name: Refuse release versions outside goodrain/rainbond
        if: ${{ endsWith(inputs.version, '-release') && github.repository != 'goodrain/rainbond' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "::error::${RELEASE_VERSION} is a release version; only goodrain/rainbond may build it"
          exit 1

      - name: Refuse single-arch builds of release versions
        if: ${{ endsWith(inputs.version, '-release') && inputs.platforms != 'linux/amd64,linux/arm64' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "::error::${RELEASE_VERSION} is a release version; build it with platforms=linux/amd64,linux/arm64 or use a non -release tag"
          exit 1

      - name: Checkout repository
        if: ${{ inputs.build-who == 'all' || inputs.build-who == 'region' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rainbond_ref || inputs.branch }}

      - name: Install native dependencies
        if: ${{ inputs.build-who == 'all' || inputs.build-who == 'region' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libzmq3-dev

      - name: Set up Go
        if: ${{ inputs.build-who == 'all' || inputs.build-who == 'region' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        if: ${{ inputs.build-who == 'all' || inputs.build-who == 'region' }}
        run: go test -mod=mod ./... -count=1

      - name: Check test manifest
        if: ${{ inputs.build-who == 'all' || inputs.build-who == 'region' }}
        run: make test-manifest-check

      - name: Skip unit tests
        if: ${{ inputs.build-who != 'all' && inputs.build-who != 'region' }}
        run: echo "Skip Rainbond Go unit tests for build-who=${{ inputs.build-who }}"

  rainbond-region:
    needs: rainbond-unit-test
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    environment: release-v6
    strategy:
      matrix:
        component: [api, chaos, worker, init-probe, mq]
        arch: [amd64, arm64]
        exclude:
          - arch: ${{ inputs.platforms == 'linux/amd64' && 'arm64' || 'none' }}
    if: inputs.build-who == 'all' || inputs.build-who == 'region'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rainbond_ref || inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOMESTIC_DOCKER_USERNAME }}
          password: ${{ secrets.DOMESTIC_DOCKER_PASSWORD }}

      - name: Set release description
        run: |
          buildTime=$(date +%F-%H)
          git_commit=$(git log -n 1 --pretty --format=%h)
          release_desc="${{ env.VERSION }}-${git_commit}-${buildTime}"
          echo "release_desc=${release_desc}" >> "${GITHUB_ENV}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          build-args: |
            RELEASE_DESC=${{ env.release_desc }}
            RAINBOND_ERROR_REPORTING_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_DSN }}
            RAINBOND_ERROR_REPORTING_REGION_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_REGION_DSN }}
            RAINBOND_ERROR_REPORTING_BACKEND_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_BACKEND_DSN }}
            RAINBOND_POSTHOG_PROJECT_TOKEN=${{ secrets.RAINBOND_POSTHOG_PROJECT_TOKEN }}
          context: .
          file: hack/contrib/docker/${{ matrix.component }}/Dockerfile
          outputs: ${{ inputs.outputs }}
          push: true
          provenance: false
          tags: |
            rainbond/rbd-${{ matrix.component }}:${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }}
            registry.cn-hangzhou.aliyuncs.com/goodrain/rbd-${{ matrix.component }}:${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }}

  rainbond-operator:
    needs: rainbond-unit-test
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    environment: release-v6
    strategy:
      matrix:
        arch: [amd64, arm64]
        exclude:
          - arch: ${{ inputs.platforms == 'linux/amd64' && 'arm64' || 'none' }}
    if: ${{ inputs.build-who == 'all' || inputs.build-who == 'operator' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: goodrain/rainbond-operator
          ref: ${{ inputs.operator_ref || inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOMESTIC_DOCKER_USERNAME }}
          password: ${{ secrets.DOMESTIC_DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          context: .
          file: ./Dockerfile
          outputs: ${{ inputs.outputs }}
          push: true
          provenance: false
          tags: |
            rainbond/rainbond-operator:${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }}
            registry.cn-hangzhou.aliyuncs.com/goodrain/rainbond-operator:${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }}
  rainbond-ui:
    needs: rainbond-unit-test
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    environment: release-v6
    strategy:
      matrix:
        arch: [amd64, arm64]
        exclude:
          - arch: ${{ inputs.platforms == 'linux/amd64' && 'arm64' || 'none' }}
    if: ${{ inputs.build-who == 'all' || inputs.build-who == 'console' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: goodrain/rainbond-ui
          ref: ${{ inputs.ui_ref || inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            rainbond/rainbond-ui:${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }}
  
  rainbond-allinone:
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    needs: [rainbond-unit-test, rainbond-ui]
    environment: release-v6
    strategy:
      matrix:
        arch: [amd64, arm64]
        exclude:
          - arch: ${{ inputs.platforms == 'linux/amd64' && 'arm64' || 'none' }}
    if: ${{ inputs.build-who == 'all' || inputs.build-who == 'console' }}
    steps:
      - name: Checkout rainbond-console repository
        uses: actions/checkout@v4
        with:
          repository: goodrain/rainbond-console
          ref: ${{ inputs.console_ref || inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOMESTIC_DOCKER_USERNAME }}
          password: ${{ secrets.DOMESTIC_DOCKER_PASSWORD }}

      - name: Set release description
        run: |
          buildTime=$(date +%F-%H)
          git_commit=$(git log -n 1 --pretty --format=%h)
          release_desc="${{ env.VERSION }}-${git_commit}-${buildTime}"
          echo "release_desc=${release_desc}" >> "${GITHUB_ENV}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          build-args: |
            RELEASE_DESC=${{ env.release_desc }}
            VERSION=${{ env.VERSION }}
            IMAGE_VERSION=${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }} 
            RAINBOND_ERROR_REPORTING_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_DSN }}
            RAINBOND_ERROR_REPORTING_FRONTEND_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_FRONTEND_DSN }}
            RAINBOND_ERROR_REPORTING_CONSOLE_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_CONSOLE_DSN }}
            RAINBOND_ERROR_REPORTING_BACKEND_DSN=${{ secrets.RAINBOND_ERROR_REPORTING_BACKEND_DSN }}
          context: .
          file: ./Dockerfile
          outputs: ${{ inputs.outputs }}
          push: true
          provenance: false
          tags: |
            rainbond/rainbond:${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }}
            registry.cn-hangzhou.aliyuncs.com/goodrain/rainbond:${{ env.VERSION }}${{ env.IS_MULTI_ARCH == 'true' && format('-{0}', matrix.arch) || '' }}

  multi-arch-manifest:
    runs-on: ubuntu-latest
    needs: [rainbond-region, rainbond-operator, rainbond-ui, rainbond-allinone]
    if: inputs.platforms == 'linux/amd64,linux/arm64'
    environment: release-v6
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOMESTIC_DOCKER_USERNAME }}
          password: ${{ secrets.DOMESTIC_DOCKER_PASSWORD }}

      - name: Create manifests
        run: |
          VERSION="${{ env.VERSION }}"
          BUILD_WHO="${{ inputs.build-who }}"

          # Region components
          if [[ "$BUILD_WHO" == "all" || "$BUILD_WHO" == "region" ]]; then
            for component in api chaos worker init-probe mq; do
              echo "Creating manifest for rbd-${component}..."
              docker buildx imagetools create -t rainbond/rbd-${component}:${VERSION} \
                rainbond/rbd-${component}:${VERSION}-amd64 \
                rainbond/rbd-${component}:${VERSION}-arm64

              docker buildx imagetools create -t registry.cn-hangzhou.aliyuncs.com/goodrain/rbd-${component}:${VERSION} \
                registry.cn-hangzhou.aliyuncs.com/goodrain/rbd-${component}:${VERSION}-amd64 \
                registry.cn-hangzhou.aliyuncs.com/goodrain/rbd-${component}:${VERSION}-arm64
            done
          fi

          # Operator
          if [[ "$BUILD_WHO" == "all" || "$BUILD_WHO" == "operator" ]]; then
            echo "Creating manifest for rainbond-operator..."
            docker buildx imagetools create -t rainbond/rainbond-operator:${VERSION} \
              rainbond/rainbond-operator:${VERSION}-amd64 \
              rainbond/rainbond-operator:${VERSION}-arm64

            docker buildx imagetools create -t registry.cn-hangzhou.aliyuncs.com/goodrain/rainbond-operator:${VERSION} \
              registry.cn-hangzhou.aliyuncs.com/goodrain/rainbond-operator:${VERSION}-amd64 \
              registry.cn-hangzhou.aliyuncs.com/goodrain/rainbond-operator:${VERSION}-arm64
          fi

          # Allinone (Console)
          if [[ "$BUILD_WHO" == "all" || "$BUILD_WHO" == "console" ]]; then
            echo "Creating manifest for rainbond..."
            docker buildx imagetools create -t rainbond/rainbond:${VERSION} \
              rainbond/rainbond:${VERSION}-amd64 \
              rainbond/rainbond:${VERSION}-arm64

            docker buildx imagetools create -t registry.cn-hangzhou.aliyuncs.com/goodrain/rainbond:${VERSION} \
              registry.cn-hangzhou.aliyuncs.com/goodrain/rainbond:${VERSION}-amd64 \
              registry.cn-hangzhou.aliyuncs.com/goodrain/rainbond:${VERSION}-arm64
          fi

          # Rainbond UI（仅推 Docker Hub，故只合并该处的多架构 manifest）
          if [[ "$BUILD_WHO" == "all" || "$BUILD_WHO" == "console" ]]; then
            echo "Creating manifest for rainbond-ui..."
            docker buildx imagetools create -t rainbond/rainbond-ui:${VERSION} \
              rainbond/rainbond-ui:${VERSION}-amd64 \
              rainbond/rainbond-ui:${VERSION}-arm64
          fi
