name: build-registry-gc-image

on:
  push:
    branches:
      - codex/registry-gc-devs8

permissions:
  contents: read

jobs:
  registry-gc:
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: release-v6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOMESTIC_DOCKER_USERNAME }}
          password: ${{ secrets.DOMESTIC_DOCKER_PASSWORD }}

      - name: Build and push Registry coordinator and GC executor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hack/contrib/docker/registry-gc/Dockerfile
          platforms: linux/amd64
          build-args: |
            REGISTRY_IMAGE=registry.cn-hangzhou.aliyuncs.com/goodrain/registry@sha256:12202eb78732e22f8658d595bd6e3d47ef9f13ede78e94e90974c020c7d7c1b3
          push: true
          provenance: false
          tags: registry.cn-hangzhou.aliyuncs.com/goodrain/rbd-registry-gc:v6.9.11-devs16

  api:
    runs-on: ubuntu-latest
    environment: release-v6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOMESTIC_DOCKER_USERNAME }}
          password: ${{ secrets.DOMESTIC_DOCKER_PASSWORD }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hack/contrib/docker/api/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: registry.cn-hangzhou.aliyuncs.com/goodrain/rbd-api:v6.9.11-devs35

  worker:
    runs-on: ubuntu-latest
    environment: release-v6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOMESTIC_DOCKER_USERNAME }}
          password: ${{ secrets.DOMESTIC_DOCKER_PASSWORD }}

      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hack/contrib/docker/worker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: registry.cn-hangzhou.aliyuncs.com/goodrain/rbd-worker:v6.9.11-devs8
