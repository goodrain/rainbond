meta:
  name: dameng-schema-safety
  version: "1.0"
  repo: /Users/zhangqihang/MyWork/workrc/rainbond
  branch: v6.9.9-dev
  design_doc: docs/plans/2026-08-19-dameng-full-compatibility-design.md

sprints:
  - id: sprint-1
    name: Fail closed when Dameng schema initialization fails
    commits:
      - id: commit-1
        message: "fix: fail Dameng startup on schema initialization errors"
        tasks: [task-1.1, task-1.2]
    tasks:
      - id: task-1.1
        name: Add a database-type-specific schema error contract
        status: completed
        files:
          modify:
            - path: db/mysql/mysql_dameng_test.go
              lines: "1-55"
            - path: test-manifest.json
              lines: "1-EOF"
        steps:
          - action: write-test
            description: Add managed tests for schema error handling before changing production code.
            code: |
              // capability_id: rainbond.database.dameng-schema-fail-closed
              func TestDamengSchemaErrorStopsStartup(t *testing.T) {
                  manager := &Manager{config: config.Config{DBType: "dm"}}
                  err := manager.schemaError("key_value", errors.New("invalid data type"))
                  if err == nil || !strings.Contains(err.Error(), "key_value") {
                      t.Fatalf("expected a table-specific Dameng schema error, got %v", err)
                  }
              }

              // capability_id: rainbond.database.dameng-schema-fail-closed
              func TestMySQLSchemaErrorKeepsLegacyStartupBehavior(t *testing.T) {
                  manager := &Manager{config: config.Config{DBType: "mysql"}}
                  if err := manager.schemaError("key_value", errors.New("invalid data type")); err != nil {
                      t.Fatalf("MySQL must retain its existing log-and-continue behavior, got %v", err)
                  }
              }
            run: "go test -mod=mod ./db/mysql -run 'Test(DamengSchemaErrorStopsStartup|MySQLSchemaErrorKeepsLegacyStartupBehavior)' -count=1"
            expect: FAIL
          - action: register-test
            description: Register the capability with the manifest manager; do not hand-edit the manifest.
            run: "python3 scripts/manage_test_manifest.py add rainbond.database.dameng-schema-fail-closed --title 'Dameng schema initialization fails closed' --interface-type package_function --interface 'db/mysql.Manager.schemaError' --code-path db/mysql/mysql.go --test db/mysql/mysql_dameng_test.go::TestDamengSchemaErrorStopsStartup --test db/mysql/mysql_dameng_test.go::TestMySQLSchemaErrorKeepsLegacyStartupBehavior --test-type regression"
            expect: PASS
        acceptance:
          - cmd: "go test -mod=mod ./db/mysql -run 'Test(DamengSchemaErrorStopsStartup|MySQLSchemaErrorKeepsLegacyStartupBehavior)' -count=1"
            expect: PASS
        references:
          - path: db/mysql/mysql.go:263-290
            note: Existing table creation loop logs every failure and continues.

      - id: task-1.2
        name: Return Dameng schema failures from manager initialization
        status: completed
        files:
          modify:
            - path: db/mysql/mysql.go
              lines: "145-151,263-290"
        steps:
          - action: implement
            description: Keep the existing MySQL path unchanged, but stop DM initialization after the first failed CreateTable or AutoMigrate.
            code: |
              // schemaError always logs the table and error. It returns a wrapped error
              // only for DB_TYPE=dm; MySQL retains its historical log-and-continue path.
              func (m *Manager) schemaError(table string, err error) error {
                  logrus.Errorf("auto migrate table %s to db error: %s", table, err)
                  if m.config.DBType != "dm" {
                      return nil
                  }
                  return fmt.Errorf("initialize Dameng schema table %s: %w", table, err)
              }

              // Change CheckTable to return error. In CreateManager, close db and
              // return the error after RegisterTableModel only when CheckTable fails.
              // In the loop, call schemaError for CreateTable and AutoMigrate errors;
              // abort only when it returns non-nil, and skip patchTable on that abort.
            run: "go test -mod=mod ./db/mysql -run 'Test(DamengSchemaErrorStopsStartup|MySQLSchemaErrorKeepsLegacyStartupBehavior)' -count=1"
            expect: PASS
          - action: verify-build
            description: Verify the public manager constructor still compiles at all call sites.
            run: "go build -mod=mod ./... && go vet -mod=mod ./..."
            expect: PASS
        acceptance:
          - cmd: "go test -mod=mod ./db/mysql -count=1"
            expect: PASS
          - cmd: "make test-manifest-check"
            expect: PASS
          - cmd: "go build -mod=mod ./... && go vet -mod=mod ./..."
            expect: PASS
        references:
          - path: db/db.go:162-184
            note: The outer manager loop already retries constructor errors, so a DM migration failure becomes visible and prevents readiness.
          - path: db/mysql/mysql.go:283-294
            note: MySQL-only bootstrap remains isolated for later dialect-specific work.
