    tasks:
      - id: task-3.1
        name: Switch cmd/args to YAML editor
        status: pending
        files:
          modify:
            - path: "src/pages/Component/kubernets.js"
              lines: "25-80,330-470,580-630"
        steps:
          - action: implement
            description: >
              Add args to DEFAULT_ATTRIBUTE_FIELDS, add cmd and args to
