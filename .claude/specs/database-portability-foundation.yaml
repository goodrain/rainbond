meta:
  name: database-portability-foundation
  version: "1.0"
  repo: "/Users/zhangqihang/MyWork/workrc"
  branch: "v6.9.9-dev"
  design_doc: "/Users/zhangqihang/MyWork/workrc/rainbond/docs/plans/2026-08-20-database-portability-design.md"

sprints:
  - id: sprint-1
    name: Region model and write portability
    commits:
      - id: commit-1
        message: "refactor: normalize region database operations"
        repo: "/Users/zhangqihang/MyWork/workrc/rainbond"
        tasks: [task-1.1, task-1.2, task-1.3]
    tasks:
      - id: task-1.1
        name: Normalize model text types
        status: completed
        files:
          modify:
            - path: "db/model/*.go"
          create:
            - path: "db/model/database_portability_test.go"
        steps:
          - action: test-first
            description: Reject MySQL-only large-text model tags.
            run: "go test -mod=mod ./db/model -count=1"
            expect: "PASS"
          - action: implement
            description: Use a large-text type supported by both MySQL and Dameng without reducing capacity.
            run: "go test -mod=mod ./db/model -count=1"
            expect: "PASS"
      - id: task-1.2
        name: Centralize portable bulk upsert
        status: completed
        files:
          create:
            - path: "db/portable/upsert.go"
            - path: "db/portable/upsert_test.go"
          modify:
            - path: "db/mysql/dao/*.go"
            - path: "db/mysql/mysql.go"
        steps:
          - action: test-first
            description: Cover MySQL fast-path compatibility, caller-owned transactions, addressable values, zero values, and business conflict keys.
            run: "go test -mod=mod ./db/portable ./db/mysql/dao -count=1"
            expect: "PASS"
          - action: implement
            description: Keep the existing MySQL bulk implementation and provide one portable update-then-insert fallback without nested transactions.
            run: "go test -mod=mod ./db/portable ./db/mysql/dao -count=1"
            expect: "PASS"
      - id: task-1.3
        name: Normalize runtime queries
        status: completed
        files:
          modify:
            - path: "db/mysql/dao/*.go"
          create:
            - path: "db/mysql/dao/query_portability_test.go"
        steps:
          - action: test-first
            description: Reject vendor-specific SQL in production runtime code while excluding the explicitly deferred schema lifecycle file.
            run: "go test -mod=mod ./db/mysql/dao -count=1"
            expect: "PASS"
          - action: implement
            description: Express pagination and conditions through GORM or parameterized common SQL.
            run: "go test -mod=mod ./db/mysql/dao -count=1"
            expect: "PASS"

  - id: sprint-2
    name: Console query portability
    commits:
      - id: commit-2
        message: "refactor: normalize console database queries"
        repo: "/Users/zhangqihang/MyWork/workrc/rainbond-console"
        tasks: [task-2.1, task-2.2]
    tasks:
      - id: task-2.1
        name: Replace database-specific query syntax
        status: completed
        files:
          modify:
            - path: "console/repositories/*.py"
            - path: "console/services/*.py"
            - path: "console/views/*.py"
            - path: "www/db/*.py"
            - path: "www/services/*.py"
            - path: "openapi/**/*.py"
          create:
            - path: "console/tests/database_sql_portability_test.py"
        steps:
          - action: test-first
            description: Reject MySQL-only aggregation, casts, quoting, comma pagination, and value interpolation across console, www, and openapi runtime SQL.
            run: "python -m unittest console.tests.database_sql_portability_test -v"
            expect: "PASS"
          - action: implement
            description: Prefer Django ORM, explicit case-insensitive search semantics, and application aggregation; otherwise use bound parameters and backend pagination.
            run: "python -m unittest console.tests.database_sql_portability_test -v"
            expect: "PASS"
      - id: task-2.2
        name: Preserve query response contracts
        status: completed
        files:
          create:
            - path: "console/repositories/plugin/listing.py"
            - path: "console/tests/base_connection_portability_test.py"
            - path: "console/tests/database_aggregation_portability_test.py"
          modify:
            - path: "console/tests/app_env_view_test.py"
        steps:
          - action: test-first
            description: Cover column-name normalization, application-side aggregation, plugin listing, permissions, pagination, and legacy response shapes.
            run: "python -m unittest console.tests.base_connection_portability_test console.tests.database_aggregation_portability_test console.tests.app_env_view_test -v"
            expect: "PASS"
          - action: implement
            description: Compose joins and aggregates with ORM rows while preserving public response fields and MySQL behavior.
            run: "python -m unittest console.tests.base_connection_portability_test console.tests.database_aggregation_portability_test console.tests.app_env_view_test -v"
            expect: "PASS"

  - id: sprint-3
    name: Cross-repository verification
    commits:
      - id: commit-3
        message: "test: verify database portability contracts"
        repo: "/Users/zhangqihang/MyWork/workrc"
        tasks: [task-3.1]
    tasks:
      - id: task-3.1
        name: Run quality gates
        status: completed
        steps:
          - action: verify
            description: Run test manifests, focused and full tests, Go build/vet, Console checks, and cross-repository response-contract review.
            run: "go test -mod=mod ./... && go build -mod=mod ./... && go vet -mod=mod ./..."
            expect: "PASS"
        acceptance:
          - "No migration executor, Operator, or deployment lifecycle changes are included."
          - "MySQL keeps the existing fast upsert path and API contracts."
          - "Runtime business code contains no known MySQL-only SQL constructs covered by the static guards."

  - id: sprint-4
    name: Database backend boundary
    commits:
      - id: commit-4
        message: "refactor: centralize database backend capabilities"
        repo: "/Users/zhangqihang/MyWork/workrc/rainbond"
        tasks: [task-4.1, task-4.2, task-4.3]
    tasks:
      - id: task-4.1
        name: Define backend registry and schema capabilities
        status: completed
        files:
          create:
            - path: "db/mysql/backend.go"
            - path: "db/mysql/backend_test.go"
          modify:
            - path: "db/mysql/mysql.go"
            - path: "db/db.go"
            - path: "config/configs/db_config.go"
        steps:
          - action: write-test
            description: Cover backend lookup, driver validation, default schema action, table metadata and MySQL table options before implementation.
            run: "go test -mod=mod ./db/mysql ./db ./config/configs -count=1"
            expect: "FAIL before implementation, then PASS"
          - action: implement
            description: Route connection, schema defaults, table checks and vendor DDL through one registered backend selected before Manager initialization.
            run: "go test -mod=mod ./db/mysql ./db ./config/configs -count=1"
            expect: "PASS"
      - id: task-4.2
        name: Remove obsolete database-specific runtime branches
        status: completed
        files:
          delete:
            - path: "db/mysql/dao/pagination.go"
            - path: "db/mysql/dao/pagination_test.go"
          modify:
            - path: "third_party/gorm-bulk-upsert/bulk_upsert.go"
            - path: "third_party/gorm-bulk-upsert/bulk_upsert_test.go"
            - path: "test-manifest.json"
            - path: "test-manifest.md"
        steps:
          - action: write-test
            description: Extend portability guards so production DAO code cannot add database-name branches or bypass the portable upsert boundary.
            run: "go test -mod=mod ./db/mysql/dao ./db/portable -count=1"
            expect: "FAIL before cleanup, then PASS"
          - action: implement
            description: Delete the unused Dameng pagination helper and old third-party Dameng upsert path; retain only the MySQL fast implementation behind db/portable.
            run: "go test -mod=mod ./db/mysql/dao ./db/portable -count=1 && (cd third_party/gorm-bulk-upsert && go test ./...)"
            expect: "PASS"
      - id: task-4.3
        name: Verify cross-database boundaries
        status: completed
        files:
          modify:
            - path: "db/mysql/dao/query_portability_test.go"
            - path: "test-manifest.json"
            - path: "test-manifest.md"
        steps:
          - action: verify
            description: Ensure database-name checks exist only in backend/driver configuration and no HTTP API contract changes are introduced.
            run: "python3 scripts/validate_test_manifest.py --repo-root . --manifest test-manifest.json"
            expect: "PASS"
        acceptance:
          - "DAO, handler and service code contain no Dameng-specific branches."
          - "Adding a database requires a driver and one backend adapter, not business query changes."
          - "MySQL keeps its existing optimized write path and schema behavior."
          - "Dameng keeps its driver, schema verification and explicit catalog behavior."
