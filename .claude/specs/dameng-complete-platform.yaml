            description: "Resolve the current Core v6.9.9-dev versus Operator v6.9.8-dev branch mismatch with an explicit workflow input or aligned operator branch. Validate all selected components use one image tag and no test-only workflow skip alters normal release defaults."
            code: |
              operator_ref: ${{ github.event.inputs.operator-branch || github.event.inputs.branch }}
            run: "workflow YAML validation plus final controlled release run"
            expect: "Core, Console, and Operator image build uses the intended source branch and shared final tag"
        acceptance:
          - cmd: "go build ./... && go vet ./..."
            expect: "PASS in Core and Operator with their declared Go toolchains"
          - cmd: "make check && pytest"
            expect: "PASS in Console"
