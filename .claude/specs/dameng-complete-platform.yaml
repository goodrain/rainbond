  - id: sprint-4
    name: Clean-environment integration and final release
    commits:
      - id: dameng-integration-governance
        message: "test: verify MySQL and Dameng platform startup"
        tasks: [integration-1, integration-2]
    tasks:
      - id: integration-1
        name: Add and run a clean-schema database acceptance matrix
        status: pending
        repos:
          - /Users/zhangqihang/MyWork/workrc/rainbond
          - /Users/zhangqihang/MyWork/workrc/rainbond-console
          - /Users/zhangqihang/MyWork/push/github/rainbond-operator
        files:
          modify:
            - path: rainbond/test-manifest.json
              lines: "capabilities"
            - path: rainbond-console/test-manifest.json
              lines: "capabilities"
          create:
            - path: docs/verification/dameng-acceptance.md
        steps:
          - action: verify
            description: "On a fresh DM test instance/schema, apply only RainbondCluster database declarations, wait for the migration Job, then verify API/Worker/Chaos/Console Ready, one nginx create-check terminal result, status lookup and delete. Repeat against an untouched MySQL baseline."
            code: |
              kubectl wait --for=condition=complete job/<migration-job> -n <namespace> --timeout=10m
              kubectl wait --for=condition=available deploy/rbd-api deploy/rbd-worker deploy/rbd-app-ui -n <namespace> --timeout=10m
            run: "documented non-secret acceptance commands"
            expect: "all checks pass; no direct RbdComponent/Deployment edits"
        acceptance:
          - cmd: "python3 scripts/validate_test_manifest.py --repo-root . --manifest test-manifest.json"
            expect: "PASS in each managed repository"

      - id: integration-2
        name: Build exactly one final compatible image set
        status: pending
        repos:
          - /Users/zhangqihang/MyWork/workrc/rainbond
          - /Users/zhangqihang/MyWork/workrc/rainbond-console
          - /Users/zhangqihang/MyWork/push/github/rainbond-operator
        files:
