meta:
  name: vm-image-reference-validation
  version: "1.1"
  repo: /Users/zhangqihang/MyWork/workrc
  branch: v6.9.8-dev
  design_doc: rainbond/docs/plans/2026-08-07-vm-image-reference-validation-design.md
  user_journey: "A user importing or uploading a VM image receives an immediate validation error for a name such as DBServer(TongYong), before any asset or component is created."

sprints:
  - id: sprint-1
    name: Minimal VM image name validation
    commits:
      - id: commit-1
        message: "fix: reject invalid vm registry imports"
        repo: rainbond
        tasks: [task-1.1]
      - id: commit-2
        message: "fix: validate vm image names"
        repo: rainbond-console
        tasks: [task-2.1]
      - id: commit-3
        message: "fix: validate vm image names"
        repo: rainbond-ui
        tasks: [task-3.1]

    tasks:
      - id: task-1.1
        name: Reject malformed registry sources before DataVolume creation
        status: completed
        files:
          modify:
            - path: rainbond/worker/appm/volume/vm_import.go
              lines: "123-375"
            - path: rainbond/worker/appm/conversion/version.go
              lines: "VM conversion error propagation"
        steps:
          - action: write-test
            description: "Prove that a registry tag containing parentheses is rejected and no incomplete VM definition is returned."
            run: "go test -mod=mod ./worker/appm/volume ./worker/appm/conversion"
            expect: FAIL
          - action: implement
            description: "Validate the normalized registry reference and propagate the sentinel error through VM conversion."
            run: "go test -mod=mod ./worker/appm/volume ./worker/appm/conversion"
            expect: PASS
          - action: verify
            description: "Run package tests, build, vet, manifest validation and diff checks."
            run: "go build -mod=mod ./... && go vet -mod=mod ./..."
            expect: PASS
        acceptance:
          - cmd: "go test -mod=mod ./worker/appm/volume ./worker/appm/conversion"
            expect: PASS

      - id: task-2.1
        name: Validate new VM import image names before persistence
        status: completed
        files:
          modify:
            - path: rainbond-console/console/services/vm_boot_source.py
              lines: "1-14"
            - path: rainbond-console/console/views/app_create/vm_run.py
              lines: "87-131"
            - path: rainbond-console/console/tests/vm_asset_instantiation_test.py
              lines: "65-158"
        steps:
          - action: write-test
            description: "Assert invalid, non-string and overlength names return 400 before asset or component creation."
            run: "DJANGO_SETTINGS_MODULE=goodrain_web.settings PYTHONPATH=. python -m unittest console.tests.vm_asset_instantiation_test.VMAssetInstantiationTests.test_vm_runtime_image_name_validator_enforces_oci_tag_boundaries console.tests.vm_asset_instantiation_test.VMAssetInstantiationTests.test_vm_run_rejects_non_string_image_name_and_import_sources console.tests.vm_asset_instantiation_test.VMAssetInstantiationTests.test_vm_run_rejects_invalid_image_name_before_new_asset_or_component_creation"
            expect: FAIL
          - action: implement
            description: "Apply the OCI tag expression only when event_id or vm_url identifies a new import, before deploy tracking or persistence."
            run: "DJANGO_SETTINGS_MODULE=goodrain_web.settings PYTHONPATH=. python -m unittest console.tests.vm_asset_instantiation_test.VMAssetInstantiationTests.test_vm_runtime_image_name_validator_enforces_oci_tag_boundaries console.tests.vm_asset_instantiation_test.VMAssetInstantiationTests.test_vm_run_rejects_non_string_image_name_and_import_sources console.tests.vm_asset_instantiation_test.VMAssetInstantiationTests.test_vm_run_rejects_invalid_image_name_before_new_asset_or_component_creation"
            expect: PASS
          - action: verify
            description: "Run targeted lint, boot-source regression tests, manifest validation and diff checks."
            run: "flake8 --extend-ignore=W605 --max-line-length 129 console/services/vm_boot_source.py console/views/app_create/vm_run.py console/tests/vm_asset_instantiation_test.py"
            expect: PASS
        acceptance:
          - cmd: "python3 scripts/validate_test_manifest.py --repo-root . --manifest test-manifest.json"
            expect: PASS

      - id: task-3.1
        name: Validate URL and upload image names in the VM form
        status: completed
        files:
          modify:
            - path: rainbond-ui/src/components/ImageVirtualMachineForm/index.js
              lines: "390-397,1032-1111"
            - path: rainbond-ui/src/locales/zh-CN/team.js
              lines: "VM create messages"
            - path: rainbond-ui/src/locales/en-US/team.js
              lines: "VM create messages"
          create:
            - path: rainbond-ui/src/components/ImageVirtualMachineForm/imageNameValidation.js
            - path: rainbond-ui/src/components/ImageVirtualMachineForm/imageNameValidation.node.test.js
        steps:
          - action: write-test
            description: "Cover valid names, parentheses, invalid leading characters, 128/129 boundaries and source-switch cleanup."
            run: "node src/components/ImageVirtualMachineForm/imageNameValidation.node.test.js"
            expect: FAIL
          - action: implement
            description: "Apply the shared expression to URL/upload fields and clear stale image_name when switching sources."
            run: "node src/components/ImageVirtualMachineForm/imageNameValidation.node.test.js"
            expect: PASS
          - action: verify
            description: "Run the focused Node test and mandatory production build."
            run: "NODE_OPTIONS=--openssl-legacy-provider yarn build"
            expect: PASS
        acceptance:
          - cmd: "node src/components/ImageVirtualMachineForm/imageNameValidation.node.test.js"
            expect: PASS
          - cmd: "NODE_OPTIONS=--openssl-legacy-provider yarn build"
            expect: PASS
