      - id: task-2.1
        name: Generate a safe internal runtime tag from a VM display name
        status: pending
        files:
          modify:
            - path: rainbond-console/console/services/vm_boot_source.py
              lines: "1-39"
            - path: rainbond-console/console/views/app_create/vm_run.py
              lines: "138-175"
            - path: rainbond-console/console/tests/vm_asset_instantiation_test.py
              lines: "1-220"
        steps:
          - action: write-test
            description: "Write regression tests that allow DBServer(TongYong) as the stored asset name while asserting its runtime reference is a lower-case legal tag and the same tenant/name produces the same reference."
            code: |
              def test_build_vm_runtime_image_name_separates_display_name_from_tag(self):
                  tenant = SimpleNamespace(namespace="tenant-ns")
                  image = build_vm_runtime_image_name(tenant, "DBServer(TongYong)")
                  self.assertRegex(image, r"^tenant-ns:vm-dbserver-tongyong-[0-9a-f]{12}$")
            run: "pytest console/tests/vm_asset_instantiation_test.py console/tests/virtual_machine_service_test.py -k 'runtime_image_name or parenthes'"
            expect: FAIL
          - action: implement
            description: "Replace direct namespace:image_name concatenation with one pure helper. The helper lowercases only the internal tag slug, replaces unsupported characters with one dash, falls back to vm, limits the slug, and appends 12 SHA-256 hex characters based on namespace plus original display name."
            code: |
              def build_vm_runtime_image_name(tenant, image_name):
                  namespace = getattr(tenant, "namespace", "") or getattr(tenant, "tenant_name", "") or getattr(tenant, "tenant_id", "") or "vm"
                  display_name = str(image_name or "vm-image")
                  slug = re.sub(r"[^a-z0-9]+", "-", display_name.lower()).strip("-") or "vm"
                  digest = hashlib.sha256((namespace + "\\x00" + display_name).encode("utf-8")).hexdigest()[:12]
                  return "{}:vm-{}-{}".format(namespace, slug[:110].rstrip("-") or "vm", digest)
            run: "pytest console/tests/vm_asset_instantiation_test.py console/tests/virtual_machine_service_test.py -k 'runtime_image_name or parenthes'"
            expect: PASS
          - action: verify
            description: "Format changed Python files, run focused VM tests, full Console check and manifest validation. Register the capability."
            run: "make format && pytest console/tests/vm_asset_instantiation_test.py console/tests/virtual_machine_service_test.py && make check && python3 scripts/validate_test_manifest.py --repo-root . --manifest test-manifest.json"
            expect: PASS
        acceptance:
          - cmd: "pytest console/tests/vm_asset_instantiation_test.py -k parenthes"
            expect: PASS
        references:
          - path: rainbond-console/console/views/app_create/vm_run.py:147-175
            note: "Current unsafe string concatenation"
          - path: rainbond-console/console/services/vm_boot_source.py:31-39
            note: "Shared runtime image helper"

      - id: task-2.2
        name: Reject malformed registry disk import attributes in Console
        status: pending
        files:
          modify:
            - path: rainbond-console/console/services/vm_boot_source.py
              lines: "1-39"
            - path: rainbond-console/console/services/virtual_machine.py
              lines: "475-492,1018-1037"
            - path: rainbond-console/console/tests/virtual_machine_service_test.py
              lines: "740-830"
        steps:
          - action: write-test
            description: "Add a test that save_vm_disk_imports raises ValueError and creates no attribute when a registry source contains DBServer(TongYong); retain the existing valid registry test."
            code: |
              def test_save_vm_disk_imports_rejects_invalid_registry_reference(self):
                  with self.assertRaises(ValueError):
                      vms.save_vm_disk_imports("tenant-a", "service-a", [{
                          "volume_name": "disk", "source_type": "registry",
                          "image_url": "tenant-a:DBServer(TongYong)"}])
            run: "pytest console/tests/virtual_machine_service_test.py -k 'disk_imports and invalid'"
            expect: FAIL
          - action: implement
            description: "Add a pure Console validator which removes docker://, rejects other schemes, parses docker_image.reference.Reference, and is invoked for every registry disk import before persistence. Keep HTTP imports unchanged."
            code: |
              def validate_vm_registry_image_reference(image_url):
                  value = str(image_url or "").strip()
                  if value.lower().startswith("docker://"):
                      value = value[len("docker://"):]
                  if not value or "://" in value:
                      raise ValueError("invalid VM registry image reference")
                  try:
                      reference.Reference.parse(value)
                  except Exception:
                      raise ValueError("invalid VM registry image reference")
                  return value
            run: "pytest console/tests/virtual_machine_service_test.py -k disk_imports"
            expect: PASS
          - action: verify
            description: "Re-run the focused VM suite and console manifest validator after formatting."
            run: "make format && pytest console/tests/vm_asset_instantiation_test.py console/tests/virtual_machine_service_test.py && make check && python3 scripts/validate_test_manifest.py --repo-root . --manifest test-manifest.json"
            expect: PASS
        acceptance:
          - cmd: "pytest console/tests/virtual_machine_service_test.py -k invalid_registry_reference"
            expect: PASS
        references:
          - path: rainbond-console/console/services/virtual_machine.py:1018-1037
            note: "Disk import persistence boundary"

