    tasks:
      - id: task-1.1
        name: Reject malformed registry sources before DataVolume creation
        status: pending
        files:
          modify:
            - path: rainbond/worker/appm/volume/vm_import.go
              lines: "123-375"
            - path: rainbond/worker/appm/volume/share-file.go
              lines: "51-145"
            - path: rainbond/worker/appm/volume/vm_import_test.go
              lines: "100-205"
        steps:
          - action: write-test
            description: "Add a capability-marked table-driven test proving a valid registry image still produces a template and an image tag containing parentheses returns an error."
            code: |
              // capability_id: rainbond.vm-import.registry-reference-validation
              func TestNormalizeVMRegistryImportURLRejectsInvalidReference(t *testing.T) {
                  _, err := normalizeVMRegistryImportURL("ceshi:DBServer(TongYong)")
                  if err == nil { t.Fatal("expected invalid OCI reference error") }
              }
            run: "go test ./worker/appm/volume -run 'TestNormalizeVMRegistryImportURLRejectsInvalidReference|TestBuildVMRegistryImportDataVolumeTemplate' -v"
            expect: FAIL
          - action: implement
            description: "Make registry URL normalization return an error after host expansion and validate it with github.com/docker/distribution/reference. Propagate the error through buildVMVolumeSource and ShareFileVolume.CreateVolume instead of appending an invalid DataVolume template."
            code: |
              func normalizeVMRegistryImportURL(imageURL string) (string, error) {
                  // trim docker://, prefix the configured registry for short names
                  // reject non-registry schemes and parse the final value
                  if _, err := reference.ParseAnyReference(url); err != nil {
                      return "", fmt.Errorf("invalid VM registry image reference %q: %w", imageURL, err)
                  }
                  return "docker://" + url, nil
              }
            run: "go test ./worker/appm/volume -run 'TestNormalizeVMRegistryImportURL|TestBuildVMRegistryImportDataVolumeTemplate' -v"
            expect: PASS
          - action: verify
            description: "Run package tests, Go build/vet, manifest validation, and gofmt. Register the new capability in the manifest."
            run: "gofmt -w worker/appm/volume/vm_import.go worker/appm/volume/share-file.go worker/appm/volume/vm_import_test.go && go test ./worker/appm/volume && go build ./... && go vet ./... && python3 scripts/validate_test_manifest.py --repo-root . --manifest test-manifest.json"
            expect: PASS
        acceptance:
          - cmd: "go test ./worker/appm/volume -run TestNormalizeVMRegistryImportURLRejectsInvalidReference -v"
            expect: PASS
          - cmd: "git -C rainbond diff --check"
            expect: "no output"
        references:
